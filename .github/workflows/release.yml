name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.25)'
        required: true
        default: 'v0.0.25'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install dependencies
        run: npm ci

      - name: Build PCF control
        run: npm run build

      - name: Restore solution project
        run: dotnet restore _SlnOnHoverReactPCF/SlnOnHoverReactPCF.cdsproj

      - name: Build managed solution
        run: dotnet build _SlnOnHoverReactPCF/SlnOnHoverReactPCF.cdsproj -c Release

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then
            echo "tag=${GITHUB_REF#refs/heads/release/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OnHoverPCF_managed ${{ steps.tag.outputs.tag }}
          body: |
            ## OnHover PCF Control - Managed Solution

            This release contains the managed solution zip for the OnHover PowerApps Component Framework control.

            ### Changes
            - Updated dependencies to latest compatible versions
            - `@fluentui/react`: 8.125.5
            - `react` / `react-dom`: 16.14.0
            - `pcf-scripts`: 1.51.1
            - `typescript`: 5.9.3
          files: _SlnOnHoverReactPCF/bin/Release/SlnOnHoverReactPCF.zip
          draft: false
          prerelease: false
